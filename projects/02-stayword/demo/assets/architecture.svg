<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img"><title>StayWord · 从输入到可用记录</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#67828c"/></marker></defs><rect width="1100" height="860" rx="20" fill="#f6f8fa"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="48" font-size="28" fill="#132f3a" font-weight="600">StayWord · 从输入到可用记录</text><text x="40" y="80" font-size="17" fill="#526b75" font-weight="400">实线：当前实现的处理关系；两端共享用户任务，各自选择运行与恢复策略。</text><rect x="40" y="112" width="260" height="95" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="58" y="142" font-size="20" fill="#153f4b" font-weight="600">录音 / 导入</text><text x="58" y="170" font-size="17" fill="#24424e" font-weight="400">保留原音频</text><rect x="420" y="112" width="260" height="95" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="438" y="142" font-size="20" fill="#153f4b" font-weight="600">16 kHz 单声道 PCM</text><text x="438" y="170" font-size="17" fill="#24424e" font-weight="400">解码后供推理读取</text><rect x="800" y="112" width="260" height="95" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="818" y="142" font-size="20" fill="#153f4b" font-weight="600">Silero VAD</text><text x="818" y="170" font-size="17" fill="#24424e" font-weight="400">检测语音区间</text><path d="M300 160 H420" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><path d="M680 160 H800" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="270" width="470" height="100" rx="12" fill="#eaf4f5" stroke="#d2dce0"/><text x="58" y="300" font-size="20" fill="#153f4b" font-weight="600">iOS · SenseVoice / Sherpa ONNX</text><text x="58" y="328" font-size="17" fill="#24424e" font-weight="400">逐段转写与时间戳；持久化采样检查点</text><rect x="590" y="270" width="470" height="100" rx="12" fill="#eef0fa" stroke="#d2dce0"/><text x="608" y="300" font-size="20" fill="#153f4b" font-weight="600">Android · 说话人处理 + SenseVoice</text><text x="608" y="328" font-size="17" fill="#24424e" font-weight="400">Pyannote / 3D-Speaker；转写完成后写入</text><path d="M930 207 V238 H275 V270" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><path d="M930 238 H825 V270" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="418" width="470" height="110" rx="12" fill="#eaf4f5" stroke="#d2dce0"/><text x="58" y="448" font-size="20" fill="#153f4b" font-weight="600">Qwen3.5-0.8B · MLX / Metal</text><text x="58" y="476" font-size="17" fill="#24424e" font-weight="400">长输入：分段总结 → 整合</text><text x="58" y="501" font-size="17" fill="#24424e" font-weight="400">模拟器不支持；生成失败保存独立错误</text><rect x="590" y="418" width="470" height="110" rx="12" fill="#eef0fa" stroke="#d2dce0"/><text x="608" y="448" font-size="20" fill="#153f4b" font-weight="600">AICore → Qwen3-0.6B / LiteRT-LM</text><text x="608" y="476" font-size="17" fill="#24424e" font-weight="400">前台可用时优先系统生成</text><text x="608" y="501" font-size="17" fill="#24424e" font-weight="400">本地 GPU 失败 → CPU；仍失败 → 抽取</text><path d="M275 370 V418" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><path d="M825 370 V418" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="580" width="470" height="90" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="58" y="610" font-size="20" fill="#153f4b" font-weight="600">转写可用 / 摘要可用或明确失败</text><text x="58" y="638" font-size="17" fill="#24424e" font-weight="400">SwiftData + 文件；前台 FIFO，后台暂停</text><rect x="590" y="580" width="470" height="90" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="608" y="610" font-size="20" fill="#153f4b" font-weight="600">生成摘要 / 抽取摘要 / 处理失败</text><text x="608" y="638" font-size="17" fill="#24424e" font-weight="400">Room + 文件；WorkManager 串行队列</text><path d="M275 528 V580" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><path d="M825 528 V580" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="727" width="620" height="86" rx="12" fill="#e1efe9" stroke="#a7c6b9"/><text x="258" y="757" font-size="20" fill="#153f4b" font-weight="600">同一条记录：阅读 → 回听核验 → 整理</text><text x="258" y="785" font-size="17" fill="#24424e" font-weight="400">原音频始终是核验依据；摘要类型与失败状态不能混淆</text><path d="M275 670 V698 H550 V727" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><path d="M825 670 V698 H550" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/></g></svg>