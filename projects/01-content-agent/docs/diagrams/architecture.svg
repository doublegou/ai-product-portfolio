<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="890" viewBox="0 0 1360 890" role="img" aria-labelledby="title desc"><title id="title">内容生产工作流架构</title><desc id="desc">四个独立入口：视频改编、口播素材、产品内容、选题研究。展示每条路径的输入、执行能力、中间材料、交付及人工控制点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56716c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#173731}.small{font-size:18px;fill:#536e66}.title{font-size:24px;font-weight:650}.body{font-size:21px}.label{font-size:16px;fill:#4d6d60}.arrow{stroke:#56716c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1360" height="890" fill="#fafbf7"/><text x="42" y="52" font-size="29" font-weight="650">内容生产工作流架构</text><text x="42" y="86" class="small">四种任务入口 · 材料传递与质量控制 · 各板块可独立使用</text><text x="42" y="132" class="title">content-workflow</text><text x="42" y="162" class="small">视频改编</text><rect x="42" y="185" width="298" height="103" rx="8" fill="#edf3e9" stroke="#c5d5ca"/><text x="60" y="211" class="label">输入</text><text x="60" y="244" class="body">视频链接 / 字幕</text><text x="60" y="275" class="body">受众与表达要求</text><path class="arrow" d="M 191.0 288 V 316"/><rect x="42" y="320" width="298" height="222" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="60" y="346" class="label">执行与中间材料</text><text x="60" y="379" class="body">yt-analysis</text><text x="60" y="410" class="body">↓ 共享 analysis.md</text><text x="60" y="441" class="body">note-writer  /  note-images</text><text x="60" y="485" class="small">正文独立写作</text><text x="60" y="514" class="small">图片规划 → 确认 → 出图</text><path class="arrow" d="M 191.0 542 V 570"/><rect x="42" y="574" width="298" height="105" rx="8" fill="#e9effc" stroke="#b7c7e5"/><text x="60" y="600" class="label">交付</text><text x="60" y="633" class="body">中文正文 + 系列卡片</text><text x="60" y="661" class="body">分析 / 规划 / 提示词</text><rect x="42" y="705" width="298" height="102" rx="8" fill="#fff5df" stroke="#dfcf9e"/><text x="60" y="731" class="label">人工控制点</text><text x="60" y="762" class="small">用户确认卡片规划</text><text x="60" y="790" class="small">检查独立阅读与图片规格</text><text x="368" y="132" class="title">script-workflow</text><text x="368" y="162" class="small">口播配套素材</text><rect x="368" y="185" width="298" height="103" rx="8" fill="#edf3e9" stroke="#c5d5ca"/><text x="386" y="211" class="label">输入</text><text x="386" y="244" class="body">口播稿 / 已编辑文案</text><text x="386" y="275" class="body">已有素材 / 人像参考</text><path class="arrow" d="M 517.0 288 V 316"/><rect x="368" y="320" width="298" height="222" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="386" y="346" class="label">执行与中间材料</text><text x="386" y="379" class="body">script-to-html-slides</text><text x="386" y="410" class="body">script-to-post</text><text x="386" y="441" class="body">script-to-image</text><text x="386" y="485" class="small">原稿 → 演示 / 文案</text><text x="386" y="514" class="small">当前文案 → 三比例封面</text><path class="arrow" d="M 517.0 542 V 570"/><rect x="368" y="574" width="298" height="105" rx="8" fill="#e9effc" stroke="#b7c7e5"/><text x="386" y="600" class="label">交付</text><text x="386" y="633" class="body">HTML + 文案 + 封面</text><text x="386" y="661" class="body">可按任务只生成部分素材</text><rect x="368" y="705" width="298" height="102" rx="8" fill="#fff5df" stroke="#dfcf9e"/><text x="386" y="731" class="label">人工控制点</text><text x="386" y="762" class="small">用户播放、编辑、反馈</text><text x="386" y="790" class="small">检查稿件版本与主题一致性</text><text x="694" y="132" class="title">content-agent</text><text x="694" y="162" class="small">产品内容</text><rect x="694" y="185" width="298" height="103" rx="8" fill="#edf3e9" stroke="#c5d5ca"/><text x="712" y="211" class="label">输入</text><text x="712" y="244" class="body">产品事实 / 账号规则</text><text x="712" y="275" class="body">平台规范 / 当前选题</text><path class="arrow" d="M 843.0 288 V 316"/><rect x="694" y="320" width="298" height="222" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="712" y="346" class="label">执行与中间材料</text><text x="712" y="379" class="body">研究 → Writer</text><text x="712" y="410" class="body">规则检查 + Reviewer</text><text x="712" y="441" class="body">Editor ↺ 最多五轮审改</text><text x="712" y="485" class="small">通过规则 → 保存 JSON</text><text x="712" y="514" class="small">未通过 / 异常 → 保留原因</text><path class="arrow" d="M 843.0 542 V 570"/><rect x="694" y="574" width="298" height="105" rx="8" fill="#e9effc" stroke="#b7c7e5"/><text x="712" y="600" class="label">交付</text><text x="712" y="633" class="body">候选稿 + 审改日志</text><text x="712" y="661" class="body">保存与发布结果分开</text><rect x="694" y="705" width="298" height="102" rx="8" fill="#fff5df" stroke="#dfcf9e"/><text x="712" y="731" class="label">人工控制点</text><text x="712" y="762" class="small">复核资料与具体主张</text><text x="712" y="790" class="small">仅草稿使用 --no-publish</text><text x="1020" y="132" class="title">daily-trend-radar</text><text x="1020" y="162" class="small">选题研究</text><rect x="1020" y="185" width="298" height="103" rx="8" fill="#edf3e9" stroke="#c5d5ca"/><text x="1038" y="211" class="label">输入</text><text x="1038" y="244" class="body">来源范围 / 条数</text><text x="1038" y="275" class="body">受众与研究方向</text><path class="arrow" d="M 1169.0 288 V 316"/><rect x="1020" y="320" width="298" height="222" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="1038" y="346" class="label">执行与中间材料</text><text x="1038" y="379" class="body">Node：采集与标准化</text><text x="1038" y="410" class="body">报告 → Agent 回查原文</text><text x="1038" y="441" class="body">筛选内容角度</text><text x="1038" y="485" class="small">来源状态 / 链接 / 时间</text><text x="1038" y="514" class="small">事实 / 推断 / 待验证项</text><path class="arrow" d="M 1169.0 542 V 570"/><rect x="1020" y="574" width="298" height="105" rx="8" fill="#e9effc" stroke="#b7c7e5"/><text x="1038" y="600" class="label">交付</text><text x="1038" y="633" class="body">来源报告 + 候选选题</text><text x="1038" y="661" class="body">保留缺失与失败来源</text><rect x="1020" y="705" width="298" height="102" rx="8" fill="#fff5df" stroke="#dfcf9e"/><text x="1038" y="731" class="label">人工控制点</text><text x="1038" y="762" class="small">用户决定是否继续制作</text><text x="1038" y="790" class="small">榜单热度不等于选题价值</text><text x="42" y="854" class="small">模型负责理解、表达和判断；程序负责采集、文件、规格与停止条件。板块之间目前通过材料交接，没有统一自动调度。</text></svg>