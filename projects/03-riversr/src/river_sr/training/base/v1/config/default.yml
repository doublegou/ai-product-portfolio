project:
  id: training_base_v1
  status: ready_for_training
  model_name: M_FULL_MECHANISTIC_V1

input:
  table: data/processed/training/sr_full50_v1.csv
  predictors: data_pipeline/training/sr_full50_v1/config/full50_predictors.txt
  hydrobasins_root: data/raw/features/hydrography/hydrobasins_l6

columns:
  row_id: row_id
  site_id: site_id
  longitude: longitude
  latitude: latitude
  response: sr87_sr86
  reference: reference_id
  current_hybas_id: r47__current_hybas_id

validation:
  expected_rows: 4485
  expected_predictors: 50
  expected_hydrological_groups: 355
  repeats: 3
  outer_folds: 5
  inner_folds: 5
  hydrological_outer_seed_base: 61000
  hydrological_inner_seed_base: 62000
  deployment_folds: 5
  deployment_seed: 63001
  spatial_scales_km: [500, 1000, 1500]
  spatial_outer_seed_base: 51000
  reference_outer_seed: 51101

search:
  mtry_fractions: [sqrt, 0.25, 0.50, 0.75]
  min_node_size: [5, 15]
  sample_fraction: [0.50, 0.70, 1.00]
  replace: [false, true]
  refinement_candidates: 16
  selection_order: pooled_rmse_asc_mae_asc_abs_bias_asc_r2_desc

model:
  splitrule: variance
  coarse_trees: 500
  refinement_trees: 1000
  outer_trees: 2000
  deployment_trees: 2000
  stress_trees: 2000
  final_trees: 4000
  primary_seed_base: 620000
  deployment_seed_base: 640000
  stress_seed_base: 660000
  final_seed: 680001
  threads: 16

output:
  folds_dir: training/base/v1/folds
  validation_dir: training/base/v1/validation
  runs_dir: training/base/v1/runs
  release_dir: training/base/v1/release
