<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img"><title>RiverSR · 验证结果决定使用范围</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#67828c"/></marker></defs><rect width="1100" height="830" rx="20" fill="#f6f8fa"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="48" font-size="28" fill="#132f3a" font-weight="600">RiverSR · 验证结果决定使用范围</text><text x="40" y="80" font-size="17" fill="#526b75" font-weight="400">实线：已有研究链路；虚线：尚未连接的真实模型应用接口。</text><rect x="40" y="115" width="290" height="110" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="58" y="145" font-size="20" fill="#153f4b" font-weight="600">观测与数据冻结</text><text x="58" y="173" font-size="17" fill="#24424e" font-weight="400">5,600 站点 / 50 特征</text><text x="58" y="198" font-size="17" fill="#24424e" font-weight="400">来源、站点、水系、输入哈希</text><rect x="405" y="115" width="290" height="110" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="423" y="145" font-size="20" fill="#153f4b" font-weight="600">水系隔离 Nested CV</text><text x="423" y="173" font-size="17" fill="#24424e" font-weight="400">外层 3 × 5；内层 5 折</text><text x="423" y="198" font-size="17" fill="#24424e" font-weight="400">预处理、权重与调参不泄漏</text><rect x="770" y="115" width="290" height="110" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="788" y="145" font-size="20" fill="#153f4b" font-weight="600">RF / XGBoost 竞争</text><text x="788" y="173" font-size="17" fill="#24424e" font-weight="400">同预算搜索；冻结后测外层</text><text x="788" y="198" font-size="17" fill="#24424e" font-weight="400">主指标：pooled OOF RMSE</text><path d="M330 170 H405" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><path d="M695 170 H770" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><rect x="770" y="280" width="290" height="110" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="788" y="310" font-size="20" fill="#153f4b" font-weight="600">固定配方压力测试</text><text x="788" y="338" font-size="17" fill="#24424e" font-weight="400">空间分块 / reference 分组</text><text x="788" y="363" font-size="17" fill="#24424e" font-weight="400">测试后不重新调参</text><path d="M915 225 V280" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><rect x="405" y="280" width="290" height="110" rx="12" fill="#eaf4f5" stroke="#d2dce0"/><text x="423" y="310" font-size="20" fill="#153f4b" font-weight="600">联合审查用途</text><text x="423" y="338" font-size="17" fill="#24424e" font-weight="400">平均误差 + 尾部 + 水系</text><text x="423" y="363" font-size="17" fill="#24424e" font-weight="400">训练拟合与严格 OOF 对照</text><path d="M770 335 H695" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="450" width="470" height="110" rx="12" fill="#e1efe9" stroke="#a7c6b9"/><text x="58" y="480" font-size="20" fill="#153f4b" font-weight="600">保留：连续回归研究基线</text><text x="58" y="508" font-size="17" fill="#24424e" font-weight="400">RF / rf_110 / W2 / 4,000 树</text><text x="58" y="533" font-size="17" fill="#24424e" font-weight="400">配方、特征、摘要和来源记录</text><rect x="590" y="450" width="470" height="110" rx="12" fill="#fff0e6" stroke="#e6bda1"/><text x="608" y="480" font-size="20" fill="#153f4b" font-weight="600">限制：高值发现与风险筛查</text><text x="608" y="508" font-size="17" fill="#24424e" font-weight="400">严格极高值命中：0/29 站点、0/5 水系</text><text x="608" y="533" font-size="17" fill="#24424e" font-weight="400">不能以训练集高召回替代外推证据</text><path d="M550 390 V420 H275 V450" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><path d="M550 420 H825 V450" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="640" width="470" height="130" rx="12" fill="#ffffff" stroke="#a7c6b9"/><text x="58" y="670" font-size="20" fill="#153f4b" font-weight="600">待接入：真实预测与不确定性</text><text x="58" y="698" font-size="17" fill="#24424e" font-weight="400">统一坐标与特征输入 / 模型版本</text><text x="58" y="723" font-size="17" fill="#24424e" font-weight="400">输入域检查 / 不确定性校准</text><text x="58" y="748" font-size="17" fill="#24424e" font-weight="400">将输出绑定查询结果与颜色</text><path d="M275 560 V640" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="590" y="640" width="470" height="130" rx="12" fill="#ffffff" stroke="#d2dce0"/><text x="608" y="670" font-size="20" fill="#153f4b" font-weight="600">已有：地图交互原型</text><text x="608" y="698" font-size="17" fill="#24424e" font-weight="400">输入同位素条件 → 查询 → 地图</text><text x="608" y="723" font-size="17" fill="#24424e" font-weight="400">当前使用合成场和独立展示颜色</text><text x="608" y="748" font-size="17" fill="#24424e" font-weight="400">尚不是实际模型的预测界面</text><path d="M510 705 H590" fill="none" stroke="#67828c" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/></g></svg>