server {
    listen 80;
    listen [::]:80;
    server_name seedxdream.com;
    return 301 https://www.seedxdream.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.seedxdream.com preview.seedxdream.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seedxdream.com;

    ssl_certificate /etc/nginx/certs/seedxdream.com/seedxdream.com_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/seedxdream.com/seedxdream.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.seedxdream.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.seedxdream.com;

    ssl_certificate /etc/nginx/certs/seedxdream.com/seedxdream.com_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/seedxdream.com/seedxdream.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web-prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name preview.seedxdream.com;

    ssl_certificate /etc/nginx/certs/seedxdream.com/seedxdream.com_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/seedxdream.com/seedxdream.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://web-preview:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
