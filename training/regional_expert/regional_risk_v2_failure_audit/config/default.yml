project:
  id: regional_risk_v2_failure_audit
  status: ready_for_read_only_audit
  purpose: diagnose_structural_information_gap_after_frozen_v2_gate_failure
  model_training_performed: false

input:
  table: data/processed/training/himalaya_risk_v2.csv
  branch_map: training/regional_expert/regional_risk_v2/folds/branch_map.csv
  full50_predictors: training/regional_expert/regional_risk_v2/config/full50_predictors.txt
  process14_predictors: training/regional_expert/regional_risk_v2/config/process14_predictors.txt
  outer_oof: training/regional_expert/regional_risk_v2/validation/oof_predictions.csv
  gate_metrics: training/regional_expert/regional_risk_v2/validation/gate_metrics.csv
  oof_manifest: training/regional_expert/regional_risk_v2/validation/oof_manifest.json
  expected_md5:
    table: 174ee6a20b8b29149259730b6e17e738
    branch_map: 19fb84f84b7770bcb918afc010a0ffa9
    full50_predictors: ac1b24b9acefe6d6ad9932b028b367d2
    process14_predictors: 239b2bfe7945fb1c878aeb267666aa15
    outer_oof: f7261c6250c0615e4433c69059a6cbef
    gate_metrics: c96eb3800f5367328765505adc1242fa
    oof_manifest: 128a140da21934cedbb6e4b971106808

columns:
  row_id: row_id
  site_id: site_id
  response: sr87_sr86
  label: high_sr_label

domain:
  rows: 372
  branches: 17
  background_upper: 0.72
  positive_lower: 0.75
  expected_background_rows: 100
  expected_positive_rows: 80

failure_set:
  primary_candidate: probability_rf__full50
  definition: positive_branch_with_zero_triggered_positive_stations
  expected_missed_branches: 8
  expected_missed_high_sr_sites: 28

overlap_audit:
  background_quantiles: [0.05, 0.95]
  strong_univariate_auc: 0.75
  low_background_overlap_fraction: 0.50
  auc_orientation: max_auc_or_one_minus_auc

nearest_neighbor_audit:
  distance: euclidean_after_domain_robust_scaling
  scaling: median_iqr_with_mad_sd_fallback
  exclude_same_branch: true
  primary_k: 5
  sensitivity_k: [1, 3, 5, 10, 20]
  weighting_views: [station_equal, branch_sqrt_edge_weighted]

recovered_reference_values:
  role: historical_context_only_not_acceptance_targets
  missed_branches: 8
  missed_high_sr_sites: 24
  median_background_interval_fraction: 1.00
  cross_branch_high_sr_neighbor_fraction: 0.147
  global_high_sr_station_fraction: 0.215

output:
  results_dir: training/regional_expert/regional_risk_v2_failure_audit/results
