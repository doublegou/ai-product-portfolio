project:
  id: regional_expert_risk_v2
  status: ready_for_engineering_check
  purpose: nonlinear_capacity_by_process_feature_regional_gate_test

input:
  table: data/processed/training/himalaya_risk_v2.csv
  v1_branch_map: training/regional_expert/regional_risk_v1/folds/branch_map.csv
  full50_predictors: training/regional_expert/regional_risk_v2/config/full50_predictors.txt
  process14_predictors: training/regional_expert/regional_risk_v2/config/process14_predictors.txt
  process14_formula_dictionary: data_pipeline/training/regional_expert/risk_v2/config/process14_formula_dictionary.yml
  expected_md5:
    table: 174ee6a20b8b29149259730b6e17e738
    v1_branch_map: 19fb84f84b7770bcb918afc010a0ffa9
    full50_predictors: ac1b24b9acefe6d6ad9932b028b367d2
    process14_predictors: 239b2bfe7945fb1c878aeb267666aa15
    process14_formula_dictionary: 17632c0d2acb977285fb4f94830f6096

columns:
  row_id: row_id
  site_id: site_id
  response: sr87_sr86
  label: high_sr_label

domain:
  expected_rows: 372
  background_upper: 0.72
  positive_lower: 0.75
  extreme_lower: 0.80
  expected_background_rows: 100
  expected_gray_rows: 192
  expected_positive_rows: 80
  expected_extreme_rows: 11
  expected_branches: 17
  expected_positive_branches: 14
  expected_extreme_branches: 4

validation:
  design: strict_nested_leave_one_regional_branch_out
  outer_folds: 17
  inner_folds_per_outer: 16
  candidates: 4
  expected_tasks: 68
  fits_per_task: 17
  expected_model_fits: 1156
  expected_thresholds: 68
  expected_outer_oof_rows: 1488
  fit_weight: inverse_sqrt_branch_size_normalized_within_analysis
  evaluation_weight: inverse_sqrt_frozen_branch_size_normalized_over_full_domain

feature_sets:
  full50:
    include_process14: false
    predictor_count: 50
  full50_process:
    include_process14: true
    predictor_count: 64

probability_rf:
  engine: ranger_probability_forest
  num_trees: 2000
  mtry_rule: floor_sqrt_predictor_count
  min_node_size: 5
  sample_fraction: 0.80
  replace: false
  splitrule: gini
  importance: permutation
  num_threads: 1

shallow_boosting:
  engine: xgboost_binary_logistic
  nrounds: 500
  max_depth: 2
  eta: 0.03
  min_child_weight: 5
  subsample: 0.80
  colsample_bytree: 0.80
  lambda: 1
  alpha: 0
  gamma: 0
  base_score: 0.5
  eval_metric: logloss
  nthread: 1

randomness:
  base_seed: 20260817
  rule: base_plus_task_times_1000_plus_fit_index

threshold:
  calibration: none
  weighting: branch_sqrt_weight
  trigger_rule: probability_greater_than_or_equal_to_threshold
  candidate_rule: unique_inner_oof_probabilities_plus_no_trigger_sentinel
  optimization: maximize_recall_subject_to_background_fpr_cap
  tie_break:
    - recall_desc
    - precision_desc
    - threshold_desc
  max_background_fpr: 0.10

evidence_targets:
  max_background_fpr: 0.10
  min_recall: 0.60
  min_precision: 0.30
  min_positive_branches_detected: 9
  min_extreme_branches_detected: 2

model:
  probability_clip: 1.0e-15
  missing_predictor_policy: fail

output:
  folds_dir: training/regional_expert/regional_risk_v2/folds
  validation_dir: training/regional_expert/regional_risk_v2/validation
  runs_dir: training/regional_expert/regional_risk_v2/runs
