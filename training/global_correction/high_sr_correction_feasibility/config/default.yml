project:
  id: high_sr_correction_feasibility_v1
  status: ready_for_training
  purpose: strict_nested_oracle_residual_feasibility
  deployable: false

input:
  table: data/processed/training/sr_full50_v1.csv
  upstream_full50_predictors: data_pipeline/training/sr_full50_v1/config/full50_predictors.txt
  full50_predictors: training/global_correction/high_sr_correction_feasibility/config/full50_predictors.txt
  env47_predictors: training/global_correction/high_sr_correction_feasibility/config/env47_predictors.txt
  base_v1_fold_manifest: training/base/v1/folds/fold_manifest.json
  base_v1_outer_assignments: training/base/v1/folds/primary_outer_assignments.csv
  base_v1_inner_assignments: training/base/v1/folds/primary_inner_assignments.csv
  base_v1_hydrological_groups: training/base/v1/folds/hydrological_groups.csv
  base_v1_release_info: training/base/v1/release/release_info.json
  base_v1_selected_params: training/base/v1/release/selected_params.yml

columns:
  row_id: row_id
  site_id: site_id
  longitude: longitude
  latitude: latitude
  response: sr87_sr86
  reference: reference_id

oracle:
  elevated_lower: 0.72
  high_lower: 0.75
  extreme_lower: 0.80
  tail_bins: [0.72_to_0.75, 0.75_to_0.80, ge_0.80]

validation:
  expected_rows: 4485
  expected_hydrological_groups: 355
  expected_full50_predictors: 50
  expected_env47_predictors: 47
  expected_elevated_rows: 671
  expected_elevated_groups: 87
  expected_high_rows: 109
  expected_extreme_rows: 20
  repeats: 3
  outer_folds: 5
  inner_folds: 5
  expected_base_tasks: 15
  expected_correction_tasks: 30
  expected_unique_base_fits_per_outer: 16
  expected_unique_base_fits_total: 240
  expected_single_exclusion_fits: 5
  expected_pair_exclusion_fits: 10

base_rf:
  mtry: 12
  min_node_size: 5
  sample_fraction: 1.0
  replace: false
  splitrule: variance
  trees: 2000
  expected_recipe_md5: 7bf3d9aefe6fa218071ddd3c426eb02a
  single_seed_base: 810000
  full_seed_base: 820000
  pair_seed_base: 825000

elastic_net:
  alpha: [0.00, 0.25, 0.50, 0.75, 1.00]
  lambda_ratio_max: 1.0
  lambda_ratio_min: 0.0001
  lambda_ratio_count: 50
  intercept: true
  standardize_in_glmnet: false
  zero_sd_tolerance: 1.0e-12

residual_rf:
  mtry_rule: round_sqrt_quarter_half_clamp_unique
  min_node_size: [5, 15]
  sample_fraction: [0.70, 1.00]
  replace: false
  splitrule: variance
  inner_trees: 1000
  outer_trees: 2000
  inner_seed_base: 830000
  outer_seed_base: 860000

selection:
  numerical_epsilon: 1.0e-12
  signal_repeat_improvement: 0.05
  repeats_required: 2
  signal_order: group_macro_mae_asc_station_mae_asc_abs_bias_asc_complexity_asc
  tail_metrics_role: diagnostic_only

promotion:
  signal_definition: candidate_vs_same_family_basepred_only
  safety_definition: candidate_vs_raw_base
  safety_repeat_min_improvement: 0.0
  mean_improvement_strictly_positive: true
  eligible_definition: residual_signal_pass_and_raw_base_safety_pass_for_same_candidate

model:
  threads: 16

output:
  folds_dir: training/global_correction/high_sr_correction_feasibility/folds
  validation_dir: training/global_correction/high_sr_correction_feasibility/validation
  runs_dir: training/global_correction/high_sr_correction_feasibility/runs
