project:
  id: training_base_v2
  status: station_frontier_topology_frozen
  model_name: M_FULL_MECHANISTIC_V2

input:
  table: data/processed/training/sr_full50_v1.csv
  predictors: data_pipeline/training/sr_full50_v1/config/full50_predictors.txt
  hydrology_interim: data/interim/sr_full50_v1_hydrology.rds
  hydrorivers_dbf: data/raw/features/hydrography/hydrorivers_v10/HydroRIVERS_v10_shp/HydroRIVERS_v10.dbf
  hydrobasins_l6_root: data/raw/features/hydrography/hydrobasins_l6
  hydrobasins_l12_root: data/raw/features/hydrography/hydrobasins_l12

columns:
  row_id: row_id
  site_id: site_id
  longitude: longitude
  latitude: latitude
  response: sr87_sr86
  reference: reference_id
  current_hybas_id: r47__current_hybas_id

topology:
  # Reach connectivity is authoritative. For each scale, station counts are
  # accumulated downstream. Reaches at or above station_trunk_support form a
  # validation trunk; each connected upstream frontier is one independent branch.
  # Tiny frontiers remain training support and are never merged across outlets.
  # L6/L12 are audit context only and never define membership or enter Full50.
  backbone_max_classical_order: 1
  scales:
    small:
      station_trunk_support: 10
      minimum_station_support: 4
    primary:
      station_trunk_support: 20
      minimum_station_support: 5
    large:
      station_trunk_support: 40
      minimum_station_support: 9
  primary_selection:
    rule: minimum_relative_anchor_distance
    historical_branch_anchor: 219
    historical_eligible_row_anchor: 2568
  sanity:
    minimum_primary_branches: 180
    maximum_primary_branches: 280
    minimum_primary_eligible_rows: 2300
    maximum_primary_eligible_rows: 2900
    maximum_primary_branch_size: 19
    maximum_primary_l12_per_branch: 20
    maximum_primary_l6_per_branch: 20
    minimum_primary_outer_purge: 100
    maximum_primary_outer_purge: 300

interim:
  site_topology: data/interim/sr_full50_v1_base_v2_site_topology.rds
  reach_graph: data/interim/sr_full50_v1_base_v2_reach_graph.rds
  downstream_pairs: data/interim/sr_full50_v1_base_v2_downstream_pairs.rds
  branch_candidates: data/interim/sr_full50_v1_base_v2_branch_candidates.rds
  prepare_manifest: data/interim/sr_full50_v1_base_v2_prepare_manifest.json

validation:
  expected_rows: 4485
  expected_predictors: 50
  repeats: 3
  outer_folds: 5
  inner_folds: 5
  deployment_folds: 5
  primary_outer_seed_base: 71000
  primary_inner_seed_base: 72000
  deployment_seed: 73001
  spatial_scales_km: [500, 1000, 1500]
  spatial_outer_seed_base: 74000
  reference_outer_seed: 74101
  terminal_outer_seed: 74201

search:
  mtry_fractions: [sqrt, 0.25, 0.50, 0.75]
  min_node_size: [5, 15]
  sample_fraction: [0.50, 0.70, 1.00]
  replace: [false, true]
  refinement_candidates: 16
  selection_order: pooled_rmse_branch_macro_rmse_pooled_mae_abs_bias_calibration_r2_parameters

model:
  splitrule: variance
  coarse_trees: 500
  refinement_trees: 1000
  outer_trees: 2000
  deployment_trees: 2000
  stress_trees: 2000
  final_trees: 4000
  primary_seed_base: 720000
  deployment_seed_base: 740000
  stress_seed_base: 760000
  final_seed: 780001
  threads: 16

output:
  folds_dir: training/base/v2/folds
  validation_dir: training/base/v2/validation
  runs_dir: training/base/v2/runs
  release_dir: training/base/v2/release
