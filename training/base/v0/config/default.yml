project:
  id: training_base_v0
  status: ready_for_training
  model_name: M_FULL_MECHANISTIC

input:
  table: data/processed/training/sr_full50_v1.csv
  predictors: data_pipeline/training/sr_full50_v1/config/full50_predictors.txt

columns:
  row_id: row_id
  site_id: site_id
  longitude: longitude
  latitude: latitude
  response: sr87_sr86
  reference: reference_id

validation:
  spatial_scales_km: [500, 1000, 1500]
  primary_scheme: spatial_1000
  outer_folds: 5
  inner_folds: 3
  spatial_outer_seed_base: 51000
  spatial_inner_seed_base: 52000
  reference_outer_seed: 51101
  reference_inner_seed_base: 51200

model:
  replace: false
  splitrule: variance
  inner_trees: 500
  outer_trees: 1500
  final_trees: 3000
  spatial_seed_base: 520000
  reference_seed_base: 540000
  final_seed: 560001
  threads: 4

smoke:
  scheme: spatial_1000
  outer_fold: 1
  inner_trees: 20
  outer_trees: 50

output:
  folds_dir: training/base/v0/folds
  validation_dir: training/base/v0/validation
  runs_dir: training/base/v0/runs
  release_dir: training/base/v0/release
